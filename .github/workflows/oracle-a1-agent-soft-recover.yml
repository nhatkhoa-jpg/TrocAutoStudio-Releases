name: Oracle A1 Agent Soft Recover

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-agent-soft-recover.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-agent-soft-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
      EXPECTED_SHAPE: VM.Standard.A1.Flex
    steps:
      - name: Validate exact A1 and soft reboot only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY"
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          trap 'rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"' EXIT
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$EXPECTED_REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"
          SHAPE="$(jq -r '.shape' <<<"$J")"
          CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"
          RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"
          test "$SHAPE" = "$EXPECTED_SHAPE"
          awk -v v="$CPU" 'BEGIN{exit !(v<=2)}'
          awk -v v="$RAM" 'BEGIN{exit !(v<=12)}'
          BV="$(oci compute boot-volume-attachment list --availability-domain "$(jq -r '."availability-domain"' <<<"$J")" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '.data[0]."boot-volume-id"')"
          test -n "$BV" && test "$BV" != null
          SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)"
          test "$SIZE" = "50"
          echo "Validated exact bounded A1: shape=$SHAPE cpu=$CPU ram_gb=$RAM boot_gb=$SIZE"
          echo "Issuing SOFTRESET only; no terminate/recreate/update-shape commands exist in this workflow."
          oci compute instance action --instance-id "$ID" --region "$R" --action SOFTRESET --wait-for-state RUNNING --wait-interval-seconds 5 >/dev/null
          sleep 35
          echo 'Waiting for Run Command plugin to report RUNNING after reboot...'
          for i in $(seq 1 24); do
            ST="$(oci instance-agent plugin list --compartment-id "$T" --instanceagent-id "$ID" --region "$R" --all | jq -r '.data[]|select(.name=="Compute Instance Run Command")|.status' | head -1)"
            echo "agent_check=$i status=${ST:-missing}"
            [ "$ST" = RUNNING ] && break
            sleep 10
          done
          [ "${ST:-}" = RUNNING ]
          PUB="$(oci compute instance list-vnics --instance-id "$ID" --region "$R" | jq -r '.data[]|select(."is-primary"==true)|."public-ip"' | head -1)"
          echo "CURRENT_PUBLIC_IP=$PUB"

      - name: Prove guest command is actually consumed
        shell: bash
        run: |
          set -Eeuo pipefail
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config" 2>/dev/null || true)"
          R="$EXPECTED_REGION"
          # Recreate transient OCI files because prior step trap removes them.
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          trap 'rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config" /tmp/out.txt' EXIT
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          ID="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -r '[.data[]|select(."lifecycle-state"=="RUNNING" and .shape=="VM.Standard.A1.Flex" and ."shape-config".ocpus<=2 and ."shape-config"."memory-in-gbs"<=12)]|sort_by(."time-created")|last|.id//empty')"
          test -n "$ID"
          CMD="$(oci instance-agent command create --region "$R" --compartment-id "$T" --target '{"instanceId":"'"$ID"'"}' --content '{"source":{"sourceType":"TEXT","text":"set -eu; echo GUEST_OK; uname -m; systemctl is-system-running || true"}}' --display-name 'troc-a1-post-reboot-probe' --query 'data.id' --raw-output)"
          test -n "$CMD" && test "$CMD" != null
          STATE=''
          for i in $(seq 1 30); do
            STATE="$(oci instance-agent command-execution get --instance-agent-command-id "$CMD" --instance-id "$ID" --region "$R" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || true)"
            echo "command_check=$i state=${STATE:-unknown}"
            case "$STATE" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
            sleep 5
          done
          test "$STATE" = SUCCEEDED
          oci instance-agent command-execution get --instance-agent-command-id "$CMD" --instance-id "$ID" --region "$R" --query 'data.content.output' --raw-output | base64 -d 2>/dev/null | sed -E 's/((token|secret|key)[=:])[[:graph:]]+/\1[REDACTED]/Ig' || true

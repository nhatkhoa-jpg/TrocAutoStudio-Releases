name: Oracle A1 Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      INSTANCE_NAME: troc-cloud-codex
      VCN_NAME: troc-codex-vcn
      SUBNET_NAME: troc-codex-hunter-subnet
      A1_SHAPE: VM.Standard.A1.Flex
      A1_MAX_OCPUS: '2'
      A1_MAX_MEMORY_GB: '12'
      A1_BOOT_VOLUME_GB: '50'

    steps:
      - name: Check required secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in OCI_CONFIG OCI_PRIVATE_KEY OCI_SSH_PUBLIC_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::$v is not configured"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install OCI CLI
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Configure OCI CLI
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"
          else
            echo "key_file=$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"

          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          REGION="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          if [ -z "$TENANCY_ID" ]; then
            echo "::error::OCI_CONFIG does not contain tenancy="
            exit 1
          fi
          if [ -z "$REGION" ]; then
            REGION="ap-singapore-2"
            echo "region=$REGION" >> "$HOME/.oci/config"
          fi

          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"
          echo "OCI_REGION=$REGION" >> "$GITHUB_ENV"
          oci iam region-subscription list --tenancy-id "$TENANCY_ID" >/dev/null
          echo "OCI authentication OK in $REGION"

      - name: Hunt A1 capacity
        if: steps.preflight.outputs.ready == 'true'
        id: hunt
        shell: bash
        run: |
          set -u
          COMPARTMENT_ID="$OCI_TENANCY_OCID"

          # PAYG safety guard: this workflow may only create the intended Always-Free-size A1 VM.
          if [ "$A1_SHAPE" != "VM.Standard.A1.Flex" ] || \
             [ "$A1_MAX_OCPUS" != "2" ] || \
             [ "$A1_MAX_MEMORY_GB" != "12" ] || \
             [ "$A1_BOOT_VOLUME_GB" != "50" ]; then
            echo "::error::PAYG safety constants were changed. Refusing to launch any OCI instance."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active_instance() {
            oci compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all 2>/dev/null |
              jq -r '.data[] | select(."lifecycle-state" != "TERMINATED") | .id' |
              head -n1
          }

          existing="$(active_instance || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            state="$(oci compute instance get --instance-id "$existing" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo UNKNOWN)"
            echo "Instance already exists: $existing ($state)"
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to stack another A1 instance in the same compartment. This prevents an
          # accidental PAYG launch from exceeding the intended 2 OCPU / 12 GB envelope.
          EXISTING_A1_COUNT="$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --all 2>/dev/null |
            jq --arg shape "$A1_SHAPE" '[.data[] | select(.shape == $shape and ."lifecycle-state" != "TERMINATED")] | length' 2>/dev/null || echo 0)"
          if [ "${EXISTING_A1_COUNT:-0}" -gt 0 ]; then
            echo "::warning::Another non-terminated $A1_SHAPE instance already exists in this compartment. Refusing to create a second A1 instance under PAYG safety mode."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AD="$(oci iam availability-domain list \
            --compartment-id "$COMPARTMENT_ID" \
            --query 'data[0].name' --raw-output 2>/dev/null)"
          if [ -z "$AD" ] || [ "$AD" = "null" ]; then
            echo "::warning::Could not resolve availability domain. Will retry next run."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Availability domain: $AD"

          VCN_ID="$(oci network vcn list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$VCN_NAME" \
            --all 2>/dev/null |
            jq -r '.data[] | select(."lifecycle-state"=="AVAILABLE") | .id' |
            head -n1)"

          if [ -z "$VCN_ID" ]; then
            echo "Creating minimal hunter VCN..."
            set +e
            VCN_OUT="$(oci network vcn create \
              --compartment-id "$COMPARTMENT_ID" \
              --cidr-block "10.42.0.0/16" \
              --display-name "$VCN_NAME" \
              --wait-for-state AVAILABLE 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::VCN create failed; will retry later."
              printf '%s\n' "$VCN_OUT"
              echo "success=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VCN_ID="$(printf '%s' "$VCN_OUT" | jq -r '.data.id // empty' 2>/dev/null)"
          fi

          if [ -z "$VCN_ID" ]; then
            VCN_ID="$(oci network vcn list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "$VCN_NAME" --all 2>/dev/null |
              jq -r '.data[] | select(."lifecycle-state"=="AVAILABLE") | .id' |
              head -n1)"
          fi

          if [ -z "$VCN_ID" ]; then
            echo "::warning::No usable VCN yet; will retry next run."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using VCN: $VCN_ID"

          SUBNET_ID="$(oci network subnet list \
            --compartment-id "$COMPARTMENT_ID" \
            --vcn-id "$VCN_ID" \
            --display-name "$SUBNET_NAME" \
            --all 2>/dev/null |
            jq -r '.data[] | select(."lifecycle-state"=="AVAILABLE") | .id' |
            head -n1)"

          if [ -z "$SUBNET_ID" ]; then
            echo "Creating minimal hunter subnet..."
            set +e
            SUBNET_OUT="$(oci network subnet create \
              --compartment-id "$COMPARTMENT_ID" \
              --vcn-id "$VCN_ID" \
              --cidr-block "10.42.0.0/24" \
              --display-name "$SUBNET_NAME" \
              --prohibit-public-ip-on-vnic true \
              --wait-for-state AVAILABLE 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::Subnet create failed; will retry later."
              printf '%s\n' "$SUBNET_OUT"
              echo "success=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SUBNET_ID="$(printf '%s' "$SUBNET_OUT" | jq -r '.data.id // empty' 2>/dev/null)"
          fi

          if [ -z "$SUBNET_ID" ]; then
            SUBNET_ID="$(oci network subnet list \
              --compartment-id "$COMPARTMENT_ID" \
              --vcn-id "$VCN_ID" \
              --display-name "$SUBNET_NAME" --all 2>/dev/null |
              jq -r '.data[] | select(."lifecycle-state"=="AVAILABLE") | .id' |
              head -n1)"
          fi

          if [ -z "$SUBNET_ID" ]; then
            echo "::warning::No usable subnet yet; will retry next run."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using subnet: $SUBNET_ID"

          IMAGE_ID="$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "$A1_SHAPE" \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --limit 1 \
            --query 'data[0].id' --raw-output 2>/dev/null)"

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "::warning::No compatible Ubuntu 24.04 A1 image yet; will retry."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Ubuntu image: $IMAGE_ID"

          METADATA="$(jq -cn --arg key "$OCI_SSH_PUBLIC_KEY" '{ssh_authorized_keys:$key}')"

          try_launch() {
            local ocpus="$1"
            local memory="$2"
            local cfg output rc instance_id

            if [ "$ocpus" -gt "$A1_MAX_OCPUS" ] || [ "$memory" -gt "$A1_MAX_MEMORY_GB" ]; then
              echo "::error::Refusing launch outside PAYG safety envelope: ${ocpus} OCPU / ${memory} GB"
              return 1
            fi

            cfg="$(jq -cn --argjson c "$ocpus" --argjson m "$memory" '{ocpus:$c,memoryInGBs:$m}')"
            echo "Trying A1: ${ocpus} OCPU / ${memory} GB / ${A1_BOOT_VOLUME_GB} GB boot"

            set +e
            output="$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --display-name "$INSTANCE_NAME" \
              --shape "$A1_SHAPE" \
              --shape-config "$cfg" \
              --image-id "$IMAGE_ID" \
              --boot-volume-size-in-gbs "$A1_BOOT_VOLUME_GB" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip false \
              --metadata "$METADATA" 2>&1)"
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              instance_id="$(printf '%s' "$output" | jq -r '.data.id // empty' 2>/dev/null)"
              if [ -z "$instance_id" ]; then
                instance_id="$(active_instance || true)"
              fi
              echo "A1 ACQUIRED: $instance_id"
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
              return 0
            fi

            if printf '%s' "$output" | grep -Eqi 'out of capacity|out of host capacity|capacity'; then
              echo "No A1 capacity for ${ocpus}/${memory} right now."
            else
              echo "::warning::Launch attempt failed for a non-capacity reason; next run will retry."
              printf '%s\n' "$output"
            fi
            return 1
          }

          if try_launch 2 12; then exit 0; fi
          if try_launch 1 6; then exit 0; fi

          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "No A1 acquired this run. Will automatically retry in about 15 minutes."
          {
            echo "## Oracle A1 Hunter"
            echo ""
            echo "No A1 capacity acquired this run."
            echo "Next automatic attempt: about 15 minutes."
            echo "PAYG safety envelope: max 2 OCPU / 12 GB RAM / 50 GB boot volume; no paid-shape fallback."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record success
        if: steps.preflight.outputs.ready == 'true' && steps.hunt.outputs.success == 'true'
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.hunt.outputs.instance_id }}
        run: |
          echo "Oracle A1 acquired: $INSTANCE_ID"
          {
            echo "## Oracle A1 acquired"
            echo ""
            echo "- Instance: \`$INSTANCE_ID\`"
            echo "- Shape: \`VM.Standard.A1.Flex\`"
            echo "- PAYG safety max: \`2 OCPU / 12 GB RAM / 50 GB boot\`"
            echo "- SSH user: \`ubuntu\`"
            echo "- Public IP: not assigned yet (intentional for robust capacity hunting)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable hunter after success
        if: steps.preflight.outputs.ready == 'true' && steps.hunt.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow disable oracle-a1-hunter.yml --repo "$GITHUB_REPOSITORY" || true
          echo "Hunter disabled after successful acquisition."

name: Oracle A1 Recover V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-a1-recover-v2.yml'

permissions:
  contents: read

concurrency:
  group: oracle-a1-recover-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      INSTANCE_NAME: troc-cloud-codex
      PUBLIC_SUBNET_NAME: troc-codex-public-subnet
      A1_SHAPE: VM.Standard.A1.Flex
      A1_OCPUS: '2'
      A1_MEMORY_GB: '12'
      BOOT_GB: '50'

    steps:
      - uses: actions/checkout@v4

      - name: Configure OCI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY" && test -n "$OCI_SSH_PUBLIC_KEY"
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"
          else
            echo "key_file=$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          echo 'SUPPRESS_LABEL_WARNING=True' >> "$GITHUB_ENV"
          echo 'OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True' >> "$GITHUB_ENV"
          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          REGION="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          test -n "$TENANCY_ID"
          if [ -z "$REGION" ]; then REGION='ap-singapore-2'; echo "region=$REGION" >> "$HOME/.oci/config"; fi
          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"
          echo "OCI_REGION=$REGION" >> "$GITHUB_ENV"
          oci iam region-subscription list --tenancy-id "$TENANCY_ID" >/dev/null

      - name: Resolve public subnet and image
        shell: bash
        run: |
          set -euo pipefail
          SUBNET_ID="$(oci network subnet list --compartment-id "$OCI_TENANCY_OCID" --all | \
            jq -r --arg n "$PUBLIC_SUBNET_NAME" '.data[] | select(."display-name"==$n and ."lifecycle-state"=="AVAILABLE") | .id' | head -n1)"
          test -n "$SUBNET_ID"
          IS_PRIVATE="$(oci network subnet get --subnet-id "$SUBNET_ID" --query 'data."prohibit-public-ip-on-vnic"' --raw-output)"
          test "$IS_PRIVATE" = 'false'
          AD="$(oci iam availability-domain list --compartment-id "$OCI_TENANCY_OCID" --query 'data[0].name' --raw-output)"
          IMAGE_ID="$(oci compute image list --compartment-id "$OCI_TENANCY_OCID" \
            --operating-system 'Canonical Ubuntu' --operating-system-version '24.04' \
            --shape "$A1_SHAPE" --sort-by TIMECREATED --sort-order DESC --limit 1 \
            --query 'data[0].id' --raw-output)"
          test -n "$AD" && test "$AD" != 'null'
          test -n "$IMAGE_ID" && test "$IMAGE_ID" != 'null'
          echo "PUBLIC_SUBNET_ID=$SUBNET_ID" >> "$GITHUB_ENV"
          echo "A1_AD=$AD" >> "$GITHUB_ENV"
          echo "A1_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Ensure one public A1
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE="$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" \
            --display-name "$INSTANCE_NAME" --all | \
            jq -c '[.data[] | select(."lifecycle-state" != "TERMINATED")] | sort_by(."time-created") | last')"
          INSTANCE_ID=''

          if [ "$ACTIVE" != 'null' ]; then
            OLD_ID="$(jq -r '.id' <<<"$ACTIVE")"
            OLD_SHAPE="$(jq -r '.shape' <<<"$ACTIVE")"
            OLD_CPU="$(jq -r '."shape-config".ocpus' <<<"$ACTIVE")"
            OLD_RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$ACTIVE")"
            test "$OLD_SHAPE" = "$A1_SHAPE"
            awk -v v="$OLD_CPU" 'BEGIN {exit !(v<=2)}'
            awk -v v="$OLD_RAM" 'BEGIN {exit !(v<=12)}'

            STATE="$(jq -r '."lifecycle-state"' <<<"$ACTIVE")"
            if [ "$STATE" != 'RUNNING' ]; then
              echo "Waiting for existing A1 ($STATE) to reach RUNNING..."
              oci compute instance get --instance-id "$OLD_ID" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null || true
            fi

            OLD_VNIC=''
            for i in $(seq 1 30); do
              OLD_VNIC="$(oci compute vnic-attachment list --compartment-id "$OCI_TENANCY_OCID" \
                --instance-id "$OLD_ID" --all --query 'data[0]."vnic-id"' --raw-output 2>/dev/null || true)"
              if [ -n "$OLD_VNIC" ] && [ "$OLD_VNIC" != 'null' ]; then break; fi
              sleep 5
            done
            OLD_SUBNET=''
            OLD_PUBLIC=''
            if [ -n "$OLD_VNIC" ] && [ "$OLD_VNIC" != 'null' ]; then
              OLD_SUBNET="$(oci network vnic get --vnic-id "$OLD_VNIC" --query 'data."subnet-id"' --raw-output 2>/dev/null || true)"
              if [ "$OLD_SUBNET" = "$PUBLIC_SUBNET_ID" ]; then
                for i in $(seq 1 30); do
                  OLD_PUBLIC="$(oci network vnic get --vnic-id "$OLD_VNIC" --query 'data."public-ip"' --raw-output 2>/dev/null || true)"
                  if [ -n "$OLD_PUBLIC" ] && [ "$OLD_PUBLIC" != 'null' ]; then break; fi
                  sleep 5
                done
              fi
            fi

            if [ "$OLD_SUBNET" = "$PUBLIC_SUBNET_ID" ] && [ -n "$OLD_PUBLIC" ] && [ "$OLD_PUBLIC" != 'null' ]; then
              echo "Reusing public A1: $OLD_PUBLIC"
              INSTANCE_ID="$OLD_ID"
            else
              echo 'Existing A1 is private; terminating it before replacement (no compute overlap).'
              oci compute instance terminate --instance-id "$OLD_ID" --preserve-boot-volume false --force >/dev/null
              for i in $(seq 1 120); do
                STATE="$(oci compute instance get --instance-id "$OLD_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo TERMINATED)"
                if [ "$STATE" = 'TERMINATED' ]; then break; fi
                sleep 5
              done
              test "$STATE" = 'TERMINATED'
            fi
          fi

          if [ -z "$INSTANCE_ID" ]; then
            CFG="$(jq -cn --argjson c "$A1_OCPUS" --argjson m "$A1_MEMORY_GB" '{ocpus:$c,memoryInGBs:$m}')"
            META="$(jq -cn --arg key "$OCI_SSH_PUBLIC_KEY" '{ssh_authorized_keys:$key}')"
            for attempt in 1 2 3 4 5; do
              echo "PAYG A1 launch attempt $attempt"
              set +e
              NEW_ID="$(oci compute instance launch --compartment-id "$OCI_TENANCY_OCID" \
                --availability-domain "$A1_AD" --display-name "$INSTANCE_NAME" \
                --shape "$A1_SHAPE" --shape-config "$CFG" --image-id "$A1_IMAGE_ID" \
                --boot-volume-size-in-gbs "$BOOT_GB" --subnet-id "$PUBLIC_SUBNET_ID" \
                --assign-public-ip true --metadata "$META" \
                --query 'data.id' --raw-output)"
              RC=$?
              set -e
              if [ "$RC" -eq 0 ] && [ -n "$NEW_ID" ] && [ "$NEW_ID" != 'null' ]; then
                INSTANCE_ID="$NEW_ID"
                break
              fi
              sleep 20
            done
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo '::error::A1 was not reacquired. No paid fallback shape was attempted.'
            exit 1
          fi

          oci compute instance get --instance-id "$INSTANCE_ID" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null
          VNIC_ID=''
          for i in $(seq 1 30); do
            VNIC_ID="$(oci compute vnic-attachment list --compartment-id "$OCI_TENANCY_OCID" \
              --instance-id "$INSTANCE_ID" --all --query 'data[0]."vnic-id"' --raw-output 2>/dev/null || true)"
            if [ -n "$VNIC_ID" ] && [ "$VNIC_ID" != 'null' ]; then break; fi
            sleep 5
          done
          test -n "$VNIC_ID" && test "$VNIC_ID" != 'null'
          PUBLIC_IP=''
          for i in $(seq 1 30); do
            PUBLIC_IP="$(oci network vnic get --vnic-id "$VNIC_ID" --query 'data."public-ip"' --raw-output 2>/dev/null || true)"
            if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != 'null' ]; then break; fi
            sleep 5
          done
          test -n "$PUBLIC_IP" && test "$PUBLIC_IP" != 'null'
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "OCI_PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "Public A1 ready at $PUBLIC_IP"

      - name: Wait for Oracle Run Command
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            PLUGINS="$(oci instance-agent plugin list --compartment-id "$OCI_TENANCY_OCID" \
              --instanceagent-id "$INSTANCE_ID" --all 2>/dev/null || true)"
            STATUS="$(jq -r '[.data[]? | select((.name|ascii_downcase|contains("run")) and (.name|ascii_downcase|contains("command")))][0].status // empty' <<<"$PLUGINS" 2>/dev/null || true)"
            echo "Run Command plugin: ${STATUS:-waiting}"
            if [ "$STATUS" = 'RUNNING' ]; then exit 0; fi
            sleep 10
          done
          echo '::error::Run Command plugin did not become ready.'
          exit 1

      - name: Bootstrap host
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_TEXT="$(cat scripts/oracle-a1-bootstrap.sh)"
          CONTENT="$(jq -cn --arg text "$SCRIPT_TEXT" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD_ID="$(oci instance-agent command create --compartment-id "$OCI_TENANCY_OCID" \
            --content "$CONTENT" --target "$TARGET" --timeout-in-seconds 1800 \
            --display-name 'troc-a1-bootstrap-v2' --query 'data.id' --raw-output)"
          FINAL=''
          EXEC=''
          for i in $(seq 1 150); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || true)"
            FINAL="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            case "$FINAL" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 10
          done
          OUTPUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          EXIT_CODE="$(jq -r '.data.content."exit-code" // 999' <<<"$EXEC" 2>/dev/null || echo 999)"
          printf '%s\n' "$OUTPUT"
          echo "Remote state=$FINAL exit=$EXIT_CODE"
          test "$FINAL" = 'SUCCEEDED'
          test "$EXIT_CODE" = '0'
          WG_PUB="$(printf '%s\n' "$OUTPUT" | sed -n 's/^WG_PUBLIC_KEY=//p' | tail -n1)"
          test -n "$WG_PUB"
          echo "WG_SERVER_PUBLIC_KEY=$WG_PUB" >> "$GITHUB_ENV"

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Oracle A1 ready'
            echo ''
            echo "- Region: \`$OCI_REGION\`"
            echo '- Compute: `VM.Standard.A1.Flex — 2 OCPU / 12 GB RAM / 50 GB boot`'
            echo "- Public IPv4: \`$OCI_PUBLIC_IP\`"
            echo '- WireGuard: `UDP 51820`, VPN `10.77.0.0/24`, MTU `1380`'
            echo "- WireGuard server public key: \`$WG_SERVER_PUBLIC_KEY\`"
            echo '- Docker + Node 22 + Gemini CLI + Codex CLI + gh + Python + Java 17 installed'
            echo '- 4 GB swap enabled'
            echo '- Public ingress exposes only WireGuard UDP/51820; SSH remains closed.'
          } >> "$GITHUB_STEP_SUMMARY"

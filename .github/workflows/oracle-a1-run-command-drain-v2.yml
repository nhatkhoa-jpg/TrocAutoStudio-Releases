name: Oracle A1 Run Command Drain V2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-run-command-drain-v2.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Drain stale executions and prove Run Command in one credential session
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          trap 'rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"' EXIT
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"; test "$R" = "$EXPECTED_REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"; test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"; test "$(jq -r '.shape' <<<"$J")" = 'VM.Standard.A1.Flex'; awk -v v="$(jq -r '."shape-config".ocpus' <<<"$J")" 'BEGIN{exit !(v<=2)}'; awk -v v="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")" 'BEGIN{exit !(v<=12)}'
          AD="$(jq -r '."availability-domain"' <<<"$J")"; BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '.data[0]."boot-volume-id"')"; test "$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)" = 50
          EXECS="$(oci instance-agent command-execution list --compartment-id "$T" --instance-id "$ID" --region "$R" --all)"
          jq -r '.data[] | "execution state=\(."lifecycle-state") delivery=\(."delivery-state") cmd_suffix=\(."instance-agent-command-id"[-12:])"' <<<"$EXECS"
          mapfile -t IDS < <(jq -r '.data[] | select(."lifecycle-state"=="ACCEPTED" or ."lifecycle-state"=="IN_PROGRESS") | ."instance-agent-command-id"' <<<"$EXECS" | sort -u)
          echo "stale_nonterminal=${#IDS[@]}"
          for cid in "${IDS[@]}"; do
            [ -n "$cid" ] || continue
            echo "cancel cmd_suffix=${cid: -12}"
            oci instance-agent command cancel --command-id "$cid" --region "$R" --force >/dev/null || true
          done
          sleep 10
          EXECS2="$(oci instance-agent command-execution list --compartment-id "$T" --instance-id "$ID" --region "$R" --all)"
          jq -r '.data[] | "postcancel state=\(."lifecycle-state") delivery=\(."delivery-state") cmd_suffix=\(."instance-agent-command-id"[-12:])"' <<<"$EXECS2"
          REM="$(jq '[.data[]|select(."lifecycle-state"=="ACCEPTED" or ."lifecycle-state"=="IN_PROGRESS")]|length' <<<"$EXECS2")"
          echo "remaining_nonterminal=$REM"
          CMD="$(oci instance-agent command create --region "$R" --compartment-id "$T" --target '{"instanceId":"'"$ID"'"}' --content '{"source":{"sourceType":"TEXT","text":"set -eu; echo GUEST_OK_AFTER_DRAIN_V2; uname -m"}}' --timeout-in-seconds 120 --display-name 'troc-a1-after-drain-v2' --query 'data.id' --raw-output)"
          test -n "$CMD" && test "$CMD" != null
          STATE=''; EXEC=''
          for i in $(seq 1 36); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD" --instance-id "$ID" --region "$R" 2>/dev/null || true)"
            STATE="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            DELIVERY="$(jq -r '.data."delivery-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            echo "probe_check=$i state=${STATE:-unknown} delivery=${DELIVERY:-unknown}"
            case "$STATE" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
            sleep 5
          done
          OUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUT" | sed -E 's/((token|secret|key)[=:])[[:graph:]]+/\1[REDACTED]/Ig'
          test "$STATE" = SUCCEEDED
          grep -q 'GUEST_OK_AFTER_DRAIN_V2' <<<"$OUT"
          echo "RUN_COMMAND_RECOVERED=1" >> "$GITHUB_ENV"

      - name: Dispatch private stack deployment
        if: env.RUN_COMMAND_RECOVERED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run oracle-a1-private-stack-deploy.yml --repo nhatkhoa-jpg/TrocAutoStudio-Releases --ref main
          echo 'PRIVATE_STACK_DEPLOY_DISPATCHED=1'

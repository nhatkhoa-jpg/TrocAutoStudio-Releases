name: Oracle A1 Rebuild Auto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-a1-rebuild-auto.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-rebuild-auto
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
      EXPECTED_SHAPE: VM.Standard.A1.Flex
      OCPUS: '2'
      MEMORY_GB: '12'
      BOOT_GB: '50'
      VCN_NAME: troc-codex-vcn
      PUBLIC_RT_NAME: troc-codex-public-rt
      PUBLIC_SL_NAME: troc-codex-public-sl
      IGW_NAME: troc-codex-igw
      PHONE_WG_PUBLIC_KEY: nhJ3KKQ1i2SnbXVzYP6Jopt1KBaYnEk8ykV8DAMozww=
      TROC_AI_MODEL: gemini-2.5-flash-lite

    steps:
      - name: Configure OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY" && test -n "$GEMINI_API_KEY"
          test "$EXPECTED_SHAPE" = 'VM.Standard.A1.Flex'
          test "$OCPUS" = '2' && test "$MEMORY_GB" = '12' && test "$BOOT_GB" = '50'
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"
          else
            printf 'key_file=%s\n' "$HOME/.oci/key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$EXPECTED_REGION"
          echo "OCI_TENANCY=$T" >> "$GITHUB_ENV"
          echo "OCI_REGION=$R" >> "$GITHUB_ENV"
          echo 'OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True' >> "$GITHUB_ENV"

      - name: Preflight network and Ubuntu image before touching old A1
        shell: bash
        run: |
          set -Eeuo pipefail
          AD="$(oci iam availability-domain list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --query 'data[0].name' --raw-output)"
          test -n "$AD" && test "$AD" != null
          VCN="$(oci network vcn list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --display-name "$VCN_NAME" --all | jq -r '[.data[]|select(."lifecycle-state"=="AVAILABLE")][0].id // empty')"
          test -n "$VCN"
          SUBNET="$(oci network subnet list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --vcn-id "$VCN" --all | jq -r '[.data[]|select(."lifecycle-state"=="AVAILABLE" and (."prohibit-public-ip-on-vnic"==false))][0].id // empty')"
          if [ -z "$SUBNET" ]; then
            SUBNET="$(oci network subnet list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --vcn-id "$VCN" --all | jq -r '[.data[]|select(."lifecycle-state"=="AVAILABLE")][0].id // empty')"
          fi
          test -n "$SUBNET"
          IMAGE="$(oci compute image list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --operating-system 'Canonical Ubuntu' --operating-system-version '24.04' --shape "$EXPECTED_SHAPE" --sort-by TIMECREATED --sort-order DESC --limit 1 --query 'data[0].id' --raw-output)"
          test -n "$IMAGE" && test "$IMAGE" != null
          echo "A1_AD=$AD" >> "$GITHUB_ENV"
          echo "A1_VCN=$VCN" >> "$GITHUB_ENV"
          echo "A1_SUBNET=$SUBNET" >> "$GITHUB_ENV"
          echo "A1_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Preflight OK: AD/network/image are ready before any destructive action."

      - name: Replace only the stuck legacy A1, preserving its boot volume
        id: replace
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(oci compute instance list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"!="TERMINATED")]|sort_by(."time-created")|last')"
          if [ "$J" != null ]; then
            ID="$(jq -r '.id' <<<"$J")"
            STATE="$(jq -r '."lifecycle-state"' <<<"$J")"
            SHAPE="$(jq -r '.shape' <<<"$J")"
            CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"
            RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"
            MANAGED="$(jq -r '."freeform-tags"."troc-rebuild-auto" // empty' <<<"$J")"
            test "$SHAPE" = "$EXPECTED_SHAPE"
            awk -v v="$CPU" 'BEGIN{exit !(v<=2)}'
            awk -v v="$RAM" 'BEGIN{exit !(v<=12)}'
            echo "Existing A1: state=$STATE managed=${MANAGED:-no}"

            if [ "$STATE" = RUNNING ]; then
              echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"
              echo "need_launch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$MANAGED" = '1' ]; then
              echo "Fresh managed A1 exists in $STATE; waiting instead of destroying it."
              set +e
              oci compute instance get --instance-id "$ID" --region "$OCI_REGION" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"
                echo "need_launch=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Fresh A1 has not reached RUNNING yet; leave it untouched for next scheduled pass."
              echo "need_launch=defer" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Legacy A1 is unhealthy ($STATE). Preserving its 50 GB boot volume and terminating compute only."
            AD="$(jq -r '."availability-domain"' <<<"$J")"
            BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$OCI_TENANCY" --instance-id "$ID" --region "$OCI_REGION" --all | jq -r '[.data[]|select(."lifecycle-state"!="DETACHED")][0]."boot-volume-id" // empty')"
            test -n "$BV"
            SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$OCI_REGION" --query 'data."size-in-gbs"' --raw-output)"
            test "$SIZE" = '50'
            echo "PRESERVED_BOOT_VOLUME=$BV" >> "$GITHUB_ENV"
            oci compute instance terminate --instance-id "$ID" --region "$OCI_REGION" --preserve-boot-volume true --force --wait-for-state TERMINATED --max-wait-seconds 900 >/dev/null
            echo "Old compute terminated; boot volume preserved: $BV"
          fi
          echo "need_launch=true" >> "$GITHUB_OUTPUT"

      - name: Launch fresh A1 only at Always Free envelope
        if: steps.replace.outputs.need_launch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          TAGS='{"troc-rebuild-auto":"1"}'
          CFG="$(jq -cn --argjson c "$OCPUS" --argjson m "$MEMORY_GB" '{ocpus:$c,memoryInGBs:$m}')"
          set +e
          OUT="$(oci compute instance launch --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --availability-domain "$A1_AD" --display-name "$INSTANCE_NAME" --shape "$EXPECTED_SHAPE" --shape-config "$CFG" --image-id "$A1_IMAGE" --boot-volume-size-in-gbs "$BOOT_GB" --subnet-id "$A1_SUBNET" --assign-public-ip true --freeform-tags "$TAGS" 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -Eqi 'capacity|out of host capacity|limit|quota' <<<"$OUT"; then
              echo "A1_NOT_AVAILABLE_YET=1"
              echo "No 2 OCPU / 12 GB A1 available right now. Old boot volume is preserved; scheduled retry will run automatically."
              exit 0
            fi
            printf '%s\n' "$OUT"
            exit "$RC"
          fi
          ID="$(jq -r '.data.id // empty' <<<"$OUT")"
          test -n "$ID"
          echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"
          echo "Fresh A1 launched: $ID"
          oci compute instance get --instance-id "$ID" --region "$OCI_REGION" --wait-for-state RUNNING --max-wait-seconds 1200 >/dev/null

      - name: Stop cleanly when capacity is unavailable
        if: steps.replace.outputs.need_launch == 'defer'
        shell: bash
        run: |
          echo 'Managed replacement is still starting; next scheduled pass will continue automatically.'
          exit 0

      - name: Resolve running A1 and configure private-web public perimeter
        if: steps.replace.outputs.need_launch != 'defer'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${INSTANCE_ID:-}" ]; then
            J="$(oci compute instance list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
            [ "$J" != null ] || { echo 'No RUNNING A1 yet; scheduled retry will continue.'; exit 0; }
            INSTANCE_ID="$(jq -r '.id' <<<"$J")"
            echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          fi
          VNIC="$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --region "$OCI_REGION" | jq -r '.data[]|select(."is-primary"==true)|.id' | head -1)"
          test -n "$VNIC"
          SUBNET="$(oci network vnic get --vnic-id "$VNIC" --region "$OCI_REGION" --query 'data."subnet-id"' --raw-output)"
          VCN="$(oci network subnet get --subnet-id "$SUBNET" --region "$OCI_REGION" --query 'data."vcn-id"' --raw-output)"

          IGW="$(oci network internet-gateway list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --vcn-id "$VCN" --all | jq -r --arg n "$IGW_NAME" '[.data[]|select(."display-name"==$n and ."lifecycle-state"=="AVAILABLE")][0].id // empty')"
          if [ -z "$IGW" ]; then
            IGW="$(oci network internet-gateway create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --vcn-id "$VCN" --is-enabled true --display-name "$IGW_NAME" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi
          RULES="$(jq -cn --arg igw "$IGW" '[{cidrBlock:"0.0.0.0/0",networkEntityId:$igw}]')"
          RT="$(oci network route-table list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --vcn-id "$VCN" --all | jq -r --arg n "$PUBLIC_RT_NAME" '[.data[]|select(."display-name"==$n and ."lifecycle-state"=="AVAILABLE")][0].id // empty')"
          if [ -z "$RT" ]; then
            RT="$(oci network route-table create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --vcn-id "$VCN" --display-name "$PUBLIC_RT_NAME" --route-rules "$RULES" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          else
            oci network route-table update --region "$OCI_REGION" --rt-id "$RT" --route-rules "$RULES" --force >/dev/null
          fi

          INGRESS='[{"source":"0.0.0.0/0","protocol":"17","isStateless":false,"udpOptions":{"destinationPortRange":{"min":51820,"max":51820}}}]'
          EGRESS='[{"destination":"0.0.0.0/0","protocol":"all","isStateless":false}]'
          SL="$(oci network security-list list --compartment-id "$OCI_TENANCY" --region "$OCI_REGION" --vcn-id "$VCN" --all | jq -r --arg n "$PUBLIC_SL_NAME" '[.data[]|select(."display-name"==$n and ."lifecycle-state"=="AVAILABLE")][0].id // empty')"
          if [ -z "$SL" ]; then
            SL="$(oci network security-list create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --vcn-id "$VCN" --display-name "$PUBLIC_SL_NAME" --ingress-security-rules "$INGRESS" --egress-security-rules "$EGRESS" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          else
            oci network security-list update --region "$OCI_REGION" --security-list-id "$SL" --ingress-security-rules "$INGRESS" --egress-security-rules "$EGRESS" --force >/dev/null
          fi
          SLIDS="$(jq -cn --arg id "$SL" '[$id]')"
          oci network subnet update --region "$OCI_REGION" --subnet-id "$SUBNET" --route-table-id "$RT" --security-list-ids "$SLIDS" --prohibit-public-ip-on-vnic false --force >/dev/null

          PUB="$(oci network vnic get --vnic-id "$VNIC" --region "$OCI_REGION" --query 'data."public-ip"' --raw-output)"
          if [ -z "$PUB" ] || [ "$PUB" = null ]; then
            PIP="$(oci network private-ip list --vnic-id "$VNIC" --region "$OCI_REGION" --all --query 'data[0].id' --raw-output)"
            PUB="$(oci network public-ip create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --lifetime EPHEMERAL --private-ip-id "$PIP" --display-name troc-codex-public-ip --wait-for-state ASSIGNED --query 'data."ip-address"' --raw-output)"
          fi
          echo "CURRENT_PUBLIC_IP=$PUB" >> "$GITHUB_ENV"
          echo "Network ready: UDP/51820 public only for target service ports; IP=$PUB"

      - name: Wait for fresh Oracle Run Command agent
        if: steps.replace.outputs.need_launch != 'defer'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          for i in $(seq 1 60); do
            P="$(oci instance-agent plugin list --compartment-id "$OCI_TENANCY" --instanceagent-id "$INSTANCE_ID" --region "$OCI_REGION" --all 2>/dev/null || true)"
            S="$(jq -r '[.data[]? | select((.name|ascii_downcase|contains("run")) and (.name|ascii_downcase|contains("command")))][0].status // empty' <<<"$P" 2>/dev/null || true)"
            [ "$S" = RUNNING ] && { echo 'Fresh Run Command agent is RUNNING'; exit 0; }
            sleep 10
          done
          echo 'Run Command agent did not become ready in 10 minutes.'
          exit 1

      - name: Deploy WireGuard and Trọc AI through fresh guest agent
        if: steps.replace.outputs.need_launch != 'defer'
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          PHONE_B64="$(printf '%s' "$PHONE_WG_PUBLIC_KEY" | base64 -w0)"
          MODEL_B64="$(printf '%s' "$TROC_AI_MODEL" | base64 -w0)"
          REMOTE="$(cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          PHONE_KEY="$(printf '%s' '__PHONE_B64__' | base64 -d)"
          MODEL="$(printf '%s' '__MODEL_B64__' | base64 -d)"
          apt-get update -y
          apt-get install -y --no-install-recommends ca-certificates curl jq wireguard-tools iptables
          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'Number(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -lt 20 ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          install -d -m 700 /etc/wireguard /etc/troc-ai /var/lib/troc-ai /srv/troc-work/queue /srv/troc-work/running /srv/troc-work/done /srv/troc-work/failed
          umask 077
          wg genkey > /etc/wireguard/server.key
          wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
          SERVER_KEY="$(cat /etc/wireguard/server.key)"
          cat >/etc/wireguard/wg0.conf <<EOF
          [Interface]
          Address = 10.77.0.1/24
          ListenPort = 51820
          PrivateKey = ${SERVER_KEY}
          MTU = 1380

          [Peer]
          PublicKey = ${PHONE_KEY}
          AllowedIPs = 10.77.0.10/32
          EOF
          chmod 600 /etc/wireguard/wg0.conf /etc/wireguard/server.key
          systemctl enable --now wg-quick@wg0
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 5 --retry-delay 2 https://github.com/nhatkhoa-jpg/TrocAutoStudio-Releases/archive/refs/heads/work/troc-ai-mobile-v1.tar.gz | tar -xz -C "$tmp"
          src="$(find "$tmp" -type d -name troc-ai | head -1)"; test -n "$src"
          node --check "$src/server.mjs"
          rm -rf /opt/troc-ai; cp -a "$src" /opt/troc-ai; chown -R root:root /opt/troc-ai; chmod -R go-w /opt/troc-ai
          printf '%s' '__KEY_B64__' | base64 -d > /etc/troc-ai/gemini.key; chmod 600 /etc/troc-ai/gemini.key
          {
            printf 'GEMINI_API_KEY=%s\n' "$(cat /etc/troc-ai/gemini.key)"
            printf 'TROC_AI_MODEL=%s\n' "$MODEL"
            printf 'TROC_AI_HOST=10.77.0.1\nTROC_AI_PORT=8787\nTROC_AI_STATE_DIR=/var/lib/troc-ai\nTROC_AI_QUEUE_DIR=/srv/troc-work/queue\n'
          } >/etc/troc-ai/env
          chmod 600 /etc/troc-ai/env
          cat >/etc/systemd/system/troc-ai.service <<'UNIT'
          [Unit]
          Description=Trọc AI private mobile gateway
          After=network-online.target wg-quick@wg0.service
          Wants=network-online.target wg-quick@wg0.service
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/troc-ai
          EnvironmentFile=/etc/troc-ai/env
          ExecStart=/usr/bin/node /opt/troc-ai/server.mjs
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/troc-ai /srv/troc-work
          ProtectHome=true
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now troc-ai.service
          for i in $(seq 1 45); do curl -fsS --max-time 5 http://10.77.0.1:8787/api/health >/tmp/health.json && break || sleep 2; done
          jq -e '.ok==true and .gemini_ready==true' /tmp/health.json >/dev/null
          curl -fsS --max-time 90 -H 'content-type: application/json' -d '{"message":"Chỉ trả lời đúng: OK","history":[],"mode":"chat"}' http://10.77.0.1:8787/api/chat >/tmp/chat.json
          jq -e '.answer|length>0' /tmp/chat.json >/dev/null
          echo "WG_SERVER_PUBLIC_KEY=$(cat /etc/wireguard/server.pub)"
          echo 'LOCAL_HEALTH_OK=1'
          echo 'GEMINI_CHAT_OK=1'
          REMOTE_SCRIPT
          )"
          REMOTE="${REMOTE//__KEY_B64__/$KEY_B64}"
          REMOTE="${REMOTE//__PHONE_B64__/$PHONE_B64}"
          REMOTE="${REMOTE//__MODEL_B64__/$MODEL_B64}"
          CONTENT="$(jq -cn --arg text "$REMOTE" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD="$(oci instance-agent command create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --target "$TARGET" --content "$CONTENT" --timeout-in-seconds 1800 --display-name troc-a1-fresh-stack --query 'data.id' --raw-output)"
          STATE=''; EXEC=''
          for i in $(seq 1 180); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD" --instance-id "$INSTANCE_ID" --region "$OCI_REGION" 2>/dev/null || true)"
            STATE="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            echo "deploy=$i state=${STATE:-unknown}"
            case "$STATE" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 10
          done
          OUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUT" | sed -E 's/((token|secret|private.?key|gemini_api_key)[=:])[[:graph:]]+/\1[REDACTED]/Ig'
          test "$STATE" = SUCCEEDED
          grep -q 'LOCAL_HEALTH_OK=1' <<<"$OUT"
          grep -q 'GEMINI_CHAT_OK=1' <<<"$OUT"
          PUBKEY="$(sed -n 's/^WG_SERVER_PUBLIC_KEY=//p' <<<"$OUT" | tail -1)"
          test -n "$PUBKEY"
          echo "WG_SERVER_PUBLIC_KEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Verify perimeter and finish
        if: steps.replace.outputs.need_launch != 'defer'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}" && test -n "${CURRENT_PUBLIC_IP:-}" && test -n "${WG_SERVER_PUBLIC_KEY:-}"
          VNIC="$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --region "$OCI_REGION" | jq -r '.data[]|select(."is-primary"==true)|.id' | head -1)"
          SUBNET="$(oci network vnic get --vnic-id "$VNIC" --region "$OCI_REGION" --query 'data."subnet-id"' --raw-output)"
          SL="$(oci network subnet get --subnet-id "$SUBNET" --region "$OCI_REGION" --query 'data."security-list-ids"[0]' --raw-output)"
          RULES="$(oci network security-list get --security-list-id "$SL" --region "$OCI_REGION" | jq '.data."ingress-security-rules"')"
          HAS22="$(jq '[.[]|select(.protocol=="6" and ((."tcp-options"."destination-port-range".min // -1)<=22) and ((."tcp-options"."destination-port-range".max // -1)>=22))]|length' <<<"$RULES")"
          HAS8787="$(jq '[.[]|select(.protocol=="6" and ((."tcp-options"."destination-port-range".min // -1)<=8787) and ((."tcp-options"."destination-port-range".max // -1)>=8787))]|length' <<<"$RULES")"
          HAS51820="$(jq '[.[]|select(.protocol=="17" and ((."udp-options"."destination-port-range".min // -1)<=51820) and ((."udp-options"."destination-port-range".max // -1)>=51820))]|length' <<<"$RULES")"
          test "$HAS22" = 0 && test "$HAS8787" = 0 && test "$HAS51820" -gt 0
          oci compute instance update --instance-id "$INSTANCE_ID" --region "$OCI_REGION" --freeform-tags '{"troc-rebuild-auto":"1","stack-ready":"1"}' --force >/dev/null
          {
            echo '## Oracle A1 rebuild complete'
            echo "- Instance: $INSTANCE_ID"
            echo "- Public IP: $CURRENT_PUBLIC_IP"
            echo '- Shape: VM.Standard.A1.Flex / 2 OCPU / 12 GB / 50 GB boot'
            echo '- Public ingress: UDP/51820 only for target ports; no TCP/22, no TCP/8787'
            echo '- WireGuard server: 10.77.0.1/24; phone peer 10.77.0.10/32'
            echo "- WireGuard server public key: $WG_SERVER_PUBLIC_KEY"
            echo '- Trọc AI local health: OK'
            echo '- Gemini chat smoke: OK'
            if [ -n "${PRESERVED_BOOT_VOLUME:-}" ]; then echo "- Old boot volume preserved for rollback: $PRESERVED_BOOT_VOLUME"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          gh workflow disable oracle-a1-rebuild-auto.yml --repo "$GITHUB_REPOSITORY" || true
          echo 'REBUILD_COMPLETE=1'

      - name: Cleanup local OCI credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"

name: Oracle A1 RunCommand Reset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-runcommand-reset.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-runcommand-reset
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Validate exact existing A1
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY"
          python -m pip install --disable-pip-version-check --quiet --prefer-binary oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"; SH="$(jq -r '.shape' <<<"$J")"; CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"; RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"; AD="$(jq -r '."availability-domain"' <<<"$J")"
          test "$SH" = 'VM.Standard.A1.Flex'; awk -v v="$CPU" 'BEGIN{exit !(v==2)}'; awk -v v="$RAM" 'BEGIN{exit !(v==12)}'
          BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '[.data[]|select(."lifecycle-state"!="DETACHED")][0]."boot-volume-id" // empty')"
          test -n "$BV"; SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)"; awk -v v="$SIZE" 'BEGIN{exit !(v==50)}'
          PUB="$(oci compute instance list-vnics --instance-id "$ID" --region "$R" | jq -r '.data[]|select(."is-primary"==true)|."public-ip"' | head -1)"
          echo "TENANCY=$T" >> "$GITHUB_ENV"; echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"; echo "PUBLIC_IP=$PUB" >> "$GITHUB_ENV"
          echo "SAFE_A1_OK shape=$SH cpu=$CPU ram=$RAM boot=$SIZE ip=$PUB"

      - name: Hard-reset only Run Command plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/disable.json <<'JSON'
          {"isManagementDisabled":false,"areAllPluginsDisabled":false,"pluginsConfig":[{"name":"Compute Instance Run Command","desiredState":"DISABLED"}]}
          JSON
          cat >/tmp/enable.json <<'JSON'
          {"isManagementDisabled":false,"areAllPluginsDisabled":false,"pluginsConfig":[{"name":"Compute Instance Run Command","desiredState":"ENABLED"}]}
          JSON
          oci compute instance update --instance-id "$INSTANCE_ID" --region "$REGION" --agent-config file:///tmp/disable.json --force >/dev/null
          echo 'Requested Run Command DISABLED'
          for i in $(seq 1 36); do
            ST="$(oci instance-agent plugin list --compartment-id "$TENANCY" --instanceagent-id "$INSTANCE_ID" --region "$REGION" --all 2>/dev/null | jq -r '.data[]|select(.name=="Compute Instance Run Command")|.status' | head -1)"
            echo "disable_check=$i status=${ST:-missing}"
            [ "${ST:-}" != RUNNING ] && break
            sleep 10
          done
          sleep 20
          oci compute instance update --instance-id "$INSTANCE_ID" --region "$REGION" --agent-config file:///tmp/enable.json --force >/dev/null
          echo 'Requested Run Command ENABLED'
          ST=''
          for i in $(seq 1 48); do
            ST="$(oci instance-agent plugin list --compartment-id "$TENANCY" --instanceagent-id "$INSTANCE_ID" --region "$REGION" --all 2>/dev/null | jq -r '.data[]|select(.name=="Compute Instance Run Command")|.status' | head -1)"
            echo "enable_check=$i status=${ST:-missing}"
            [ "$ST" = RUNNING ] && break
            sleep 10
          done
          test "$ST" = RUNNING
          sleep 20

      - name: Prove Run Command is consumed
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$(oci instance-agent command create --region "$REGION" --compartment-id "$TENANCY" --target '{"instanceId":"'"$INSTANCE_ID"'"}' --content '{"source":{"sourceType":"TEXT","text":"set -eu; echo GUEST_OK; uname -m"},"output":{"outputType":"TEXT"},"commandString":"/bin/bash"}' --timeout-in-seconds 180 --display-name runcommand-reset-probe --query 'data.id' --raw-output)"
          E=''; S=''
          for i in $(seq 1 48); do
            E="$(oci instance-agent command-execution get --command-id "$C" --instance-id "$INSTANCE_ID" --region "$REGION" 2>/dev/null || true)"
            S="$(jq -r '.data."lifecycle-state" // empty' <<<"$E" 2>/dev/null || true)"
            echo "probe_check=$i state=${S:-unknown}"
            case "$S" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 5
          done
          test "$S" = SUCCEEDED
          O="$(jq -r '.data.content.output // empty' <<<"$E" 2>/dev/null | base64 -d 2>/dev/null || true)"
          [ -n "$O" ] || O="$(jq -r '.data.content.text // empty' <<<"$E" 2>/dev/null || true)"
          printf '%s\n' "$O"
          grep -q GUEST_OK <<<"$O"
          echo RUNCOMMAND_CONSUMED_OK=1

      - name: Dispatch private stack deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run oracle-a1-private-stack-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo PRIVATE_STACK_DISPATCHED=1

      - name: Cleanup OCI credentials
        if: always()
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config" /tmp/disable.json /tmp/enable.json

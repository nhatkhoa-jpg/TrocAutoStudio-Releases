name: Oracle A1 Private Stack Deploy

on:
  workflow_run:
    workflows: ['Oracle A1 Agent Soft Recover']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-private-stack-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
      EXPECTED_SHAPE: VM.Standard.A1.Flex
      PHONE_WG_PUBLIC_KEY: nhJ3KKQ1i2SnbXVzYP6Jopt1KBaYnEk8ykV8DAMozww=
      TROC_AI_MODEL: gemini-2.5-flash-lite
    steps:
      - name: Configure OCI and validate bounded A1
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY" && test -n "$GEMINI_API_KEY"
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          echo 'SUPPRESS_LABEL_WARNING=True' >> "$GITHUB_ENV"
          echo 'OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True' >> "$GITHUB_ENV"
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$EXPECTED_REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"; SHAPE="$(jq -r '.shape' <<<"$J")"; CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"; RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"
          test "$SHAPE" = "$EXPECTED_SHAPE"; awk -v v="$CPU" 'BEGIN{exit !(v<=2)}'; awk -v v="$RAM" 'BEGIN{exit !(v<=12)}'
          AD="$(jq -r '."availability-domain"' <<<"$J")"
          BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '.data[0]."boot-volume-id"')"
          SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)"; test "$SIZE" = 50
          VNIC="$(oci compute instance list-vnics --instance-id "$ID" --region "$R" | jq -r '.data[]|select(."is-primary"==true)|.id' | head -1)"
          PUB="$(oci network vnic get --vnic-id "$VNIC" --region "$R" --query 'data."public-ip"' --raw-output)"
          echo "OCI_TENANCY=$T" >> "$GITHUB_ENV"; echo "OCI_REGION=$R" >> "$GITHUB_ENV"; echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"; echo "CURRENT_PUBLIC_IP=$PUB" >> "$GITHUB_ENV"
          echo "Validated A1 shape=$SHAPE cpu=$CPU ram=$RAM boot=$SIZE current_public_ip=$PUB"

      - name: Deploy WireGuard plus Trọc AI through Run Command
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          PHONE_B64="$(printf '%s' "$PHONE_WG_PUBLIC_KEY" | base64 -w0)"
          MODEL_B64="$(printf '%s' "$TROC_AI_MODEL" | base64 -w0)"
          REMOTE="$(cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          PHONE_KEY="$(printf '%s' '__PHONE_B64__' | base64 -d)"
          MODEL="$(printf '%s' '__MODEL_B64__' | base64 -d)"
          install_pkg() { command -v "$1" >/dev/null 2>&1 || { apt-get update -y; apt-get install -y --no-install-recommends "$2"; }; }
          install_pkg wg wireguard-tools
          install_pkg curl curl
          install_pkg jq jq
          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'Number(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -lt 20 ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          install -d -m 700 /etc/wireguard /etc/troc-ai /var/lib/troc-ai /srv/troc-work/queue /srv/troc-work/running /srv/troc-work/done /srv/troc-work/failed
          umask 077
          [ -s /etc/wireguard/server.key ] || wg genkey > /etc/wireguard/server.key
          wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
          SERVER_KEY="$(cat /etc/wireguard/server.key)"
          WAN_IF="$(ip route show default | awk '{print $5;exit}')"; test -n "$WAN_IF"
          cat >/etc/wireguard/wg0.conf <<EOF
          [Interface]
          Address = 10.77.0.1/24
          ListenPort = 51820
          PrivateKey = ${SERVER_KEY}
          MTU = 1380
          PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT
          PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT

          [Peer]
          PublicKey = ${PHONE_KEY}
          AllowedIPs = 10.77.0.10/32
          EOF
          chmod 600 /etc/wireguard/wg0.conf /etc/wireguard/server.key
          systemctl enable wg-quick@wg0
          systemctl restart wg-quick@wg0
          ip -4 addr show wg0 | grep -q '10\.77\.0\.1/24'
          ss -lun | grep -q ':51820 '

          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 5 --retry-delay 2 https://github.com/nhatkhoa-jpg/TrocAutoStudio-Releases/archive/refs/heads/work/troc-ai-mobile-v1.tar.gz | tar -xz -C "$tmp"
          src="$(find "$tmp" -type d -name troc-ai | head -1)"; test -n "$src"
          node --check "$src/server.mjs"
          rm -rf /opt/troc-ai.new; cp -a "$src" /opt/troc-ai.new; chown -R root:root /opt/troc-ai.new; chmod -R go-w /opt/troc-ai.new
          printf '%s' '__KEY_B64__' | base64 -d > /etc/troc-ai/gemini.key; chmod 600 /etc/troc-ai/gemini.key
          {
            printf 'GEMINI_API_KEY=%s\n' "$(cat /etc/troc-ai/gemini.key)"
            printf 'TROC_AI_MODEL=%s\n' "$MODEL"
            printf 'TROC_AI_HOST=10.77.0.1\nTROC_AI_PORT=8787\nTROC_AI_STATE_DIR=/var/lib/troc-ai\nTROC_AI_QUEUE_DIR=/srv/troc-work/queue\n'
          } > /etc/troc-ai/env
          chmod 600 /etc/troc-ai/env
          rm -rf /opt/troc-ai.prev; [ ! -d /opt/troc-ai ] || mv /opt/troc-ai /opt/troc-ai.prev; mv /opt/troc-ai.new /opt/troc-ai; rm -rf /opt/troc-ai.prev
          cat >/etc/systemd/system/troc-ai.service <<'UNIT'
          [Unit]
          Description=Trọc AI private mobile gateway
          After=network-online.target wg-quick@wg0.service
          Wants=network-online.target wg-quick@wg0.service
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/troc-ai
          EnvironmentFile=/etc/troc-ai/env
          ExecStart=/usr/bin/node /opt/troc-ai/server.mjs
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/troc-ai /srv/troc-work
          ProtectHome=true
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable troc-ai.service
          systemctl restart troc-ai.service
          for i in $(seq 1 30); do curl -fsS --max-time 5 http://10.77.0.1:8787/api/health >/tmp/h.json && break || sleep 2; done
          jq -e '.ok==true and .gemini_ready==true' /tmp/h.json >/dev/null
          curl -fsS --max-time 90 -H 'content-type: application/json' -d '{"message":"Chỉ trả lời đúng: OK","history":[],"mode":"chat"}' http://10.77.0.1:8787/api/chat >/tmp/c.json
          jq -e '.answer|length>0' /tmp/c.json >/dev/null
          systemctl is-enabled wg-quick@wg0 | grep -q enabled
          systemctl is-enabled troc-ai.service | grep -q enabled
          systemctl is-active wg-quick@wg0 | grep -q active
          systemctl is-active troc-ai.service | grep -q active
          echo "SERVER_WG_PUBLIC_KEY=$(cat /etc/wireguard/server.pub)"
          echo "TROC_AI_HEALTH_OK=1"
          echo "GEMINI_CHAT_SMOKE_OK=1"
          REMOTE_SCRIPT
          )"
          REMOTE="${REMOTE//__KEY_B64__/$KEY_B64}"; REMOTE="${REMOTE//__PHONE_B64__/$PHONE_B64}"; REMOTE="${REMOTE//__MODEL_B64__/$MODEL_B64}"
          CONTENT="$(jq -cn --arg text "$REMOTE" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD="$(oci instance-agent command create --region "$OCI_REGION" --compartment-id "$OCI_TENANCY" --target "$TARGET" --content "$CONTENT" --timeout-in-seconds 1500 --display-name 'deploy-private-troc-stack' --query 'data.id' --raw-output)"
          EXEC=''; STATE=''
          for i in $(seq 1 150); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD" --instance-id "$INSTANCE_ID" --region "$OCI_REGION" 2>/dev/null || true)"
            STATE="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            echo "deploy_check=$i state=${STATE:-unknown}"
            case "$STATE" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 8
          done
          OUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUT" | sed -E 's/((token|secret|private.?key|gemini_api_key)[=:])[[:graph:]]+/\1[REDACTED]/Ig'
          test "$STATE" = SUCCEEDED
          grep -q 'TROC_AI_HEALTH_OK=1' <<<"$OUT"
          grep -q 'GEMINI_CHAT_SMOKE_OK=1' <<<"$OUT"
          WG_PUB="$(sed -n 's/^SERVER_WG_PUBLIC_KEY=//p' <<<"$OUT" | tail -1)"; test -n "$WG_PUB"
          echo "WG_SERVER_PUBLIC_KEY=$WG_PUB" >> "$GITHUB_ENV"

      - name: Validate public perimeter is still private-web only
        shell: bash
        run: |
          set -Eeuo pipefail
          VNIC="$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --region "$OCI_REGION" | jq -r '.data[]|select(."is-primary"==true)|.id' | head -1)"
          SUBNET="$(oci network vnic get --vnic-id "$VNIC" --region "$OCI_REGION" --query 'data."subnet-id"' --raw-output)"
          SL="$(oci network subnet get --subnet-id "$SUBNET" --region "$OCI_REGION" --query 'data."security-list-ids"[0]' --raw-output)"
          RULES="$(oci network security-list get --security-list-id "$SL" --region "$OCI_REGION")"
          jq -e '[.data."ingress-security-rules"[]? | select(.protocol=="6") | ((."tcp-options".destination."port-range".min // -1))] | (index(22)==null and index(8787)==null)' <<<"$RULES" >/dev/null
          jq -e '[.data."ingress-security-rules"[]? | select(.protocol=="17") | ((."udp-options".destination."port-range".min // -1))] | index(51820)!=null' <<<"$RULES" >/dev/null
          echo 'PUBLIC_PERIMETER_OK=UDP_51820_ONLY_FOR_TARGET_PORTS'

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Oracle A1 private stack deployed'
            echo "- Current public endpoint: $CURRENT_PUBLIC_IP:51820/UDP"
            echo "- Server WireGuard public key: $WG_SERVER_PUBLIC_KEY"
            echo '- VPN server: 10.77.0.1/24; phone peer: 10.77.0.10/32; MTU 1380'
            echo '- Trọc AI: http://10.77.0.1:8787 (WireGuard only)'
            echo '- systemd enable+active verified for wg-quick@wg0 and troc-ai.service'
            echo '- /api/health passed and live Gemini chat smoke passed'
            echo '- TCP/22 and TCP/8787 remain absent from public security-list ingress'
          } >> "$GITHUB_STEP_SUMMARY"

    paths:
      - '.github/workflows/a1-recovery-stop.yml'

permissions:
  contents: read

concurrency:
  group: oracle-a1-cloud-init-recover
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2

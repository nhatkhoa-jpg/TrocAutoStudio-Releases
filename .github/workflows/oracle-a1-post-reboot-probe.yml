name: Oracle A1 Post Reboot Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-post-reboot-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Prove Run Command reaches the existing bounded A1
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          trap 'rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"' EXIT
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test "$R" = "$EXPECTED_REGION"
          ID="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -r '[.data[]|select(."lifecycle-state"=="RUNNING" and .shape=="VM.Standard.A1.Flex" and ."shape-config".ocpus<=2 and ."shape-config"."memory-in-gbs"<=12)]|sort_by(."time-created")|last|.id//empty')"
          test -n "$ID"
          CMD="$(oci instance-agent command create --region "$R" --compartment-id "$T" --target '{"instanceId":"'"$ID"'"}' --content '{"source":{"sourceType":"TEXT","text":"set -eu; echo GUEST_OK; uname -m; systemctl is-system-running || true"}}' --timeout-in-seconds 120 --display-name 'troc-a1-post-reboot-probe-v2' --query 'data.id' --raw-output)"
          test -n "$CMD" && test "$CMD" != null
          STATE=''; EXEC=''
          for i in $(seq 1 30); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD" --instance-id "$ID" --region "$R" 2>/dev/null || true)"
            STATE="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            echo "probe_check=$i state=${STATE:-unknown}"
            case "$STATE" in SUCCEEDED|FAILED|CANCELED|TIMED_OUT) break;; esac
            sleep 4
          done
          OUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUT" | sed -E 's/((token|secret|key)[=:])[[:graph:]]+/\1[REDACTED]/Ig'
          test "$STATE" = SUCCEEDED
          grep -q 'GUEST_OK' <<<"$OUT"

      - name: Dispatch private WireGuard and Trọc AI deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run oracle-a1-private-stack-deploy.yml --repo nhatkhoa-jpg/TrocAutoStudio-Releases --ref main
          echo 'PRIVATE_STACK_DEPLOY_DISPATCHED=1'

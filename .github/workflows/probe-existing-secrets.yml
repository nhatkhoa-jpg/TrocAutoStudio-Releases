name: Probe Existing Secret Names

on:
  push:
    branches: ['work/troc-ai-mobile-v1']
    paths: ['.github/workflows/probe-existing-secrets.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
      CLOUD_AI_GH_TOKEN: ${{ secrets.CLOUD_AI_GH_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for n in OCI_SSH_PRIVATE_KEY SSH_PRIVATE_KEY GH_PAT GITHUB_PAT CODEX_GITHUB_TOKEN CLOUD_AI_GH_TOKEN; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=MISSING"; fi
          done

name: Deploy Trọc AI to Oracle A1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'troc-ai/**'
      - '.github/workflows/oracle-a1-deploy-troc-ai.yml'

permissions:
  contents: read

concurrency:
  group: oracle-a1-deploy-troc-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INSTANCE_NAME: troc-cloud-codex
      TROC_AI_MODEL: gemini-3.5-flash-lite

    steps:
      - uses: actions/checkout@v4

      - name: Preflight secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG"
          test -n "$OCI_PRIVATE_KEY"
          test -n "$GEMINI_API_KEY"
          echo 'Required OCI and Gemini secrets are present.'

      - name: Configure OCI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"
          else
            echo "key_file=$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          echo 'SUPPRESS_LABEL_WARNING=True' >> "$GITHUB_ENV"
          echo 'OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True' >> "$GITHUB_ENV"
          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          REGION="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          test -n "$TENANCY_ID"
          if [ -z "$REGION" ]; then REGION='ap-singapore-2'; echo "region=$REGION" >> "$HOME/.oci/config"; fi
          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"
          echo "OCI_REGION=$REGION" >> "$GITHUB_ENV"
          oci iam region-subscription list --tenancy-id "$TENANCY_ID" >/dev/null

      - name: Resolve running public A1
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" \
            --display-name "$INSTANCE_NAME" --all | jq -r '[.data[] | select(."lifecycle-state"=="RUNNING" and .shape=="VM.Standard.A1.Flex" and ."shape-config".ocpus<=2 and ."shape-config"."memory-in-gbs"<=12)] | sort_by(."time-created") | last | .id // empty')"
          test -n "$INSTANCE_ID"
          VNIC_ID="$(oci compute vnic-attachment list --compartment-id "$OCI_TENANCY_OCID" --instance-id "$INSTANCE_ID" --all --query 'data[0]."vnic-id"' --raw-output)"
          test -n "$VNIC_ID" && test "$VNIC_ID" != 'null'
          PUBLIC_IP="$(oci network vnic get --vnic-id "$VNIC_ID" --query 'data."public-ip"' --raw-output)"
          test -n "$PUBLIC_IP" && test "$PUBLIC_IP" != 'null'
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "OCI_PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "Using Oracle A1 at $PUBLIC_IP"

      - name: Wait for Oracle Run Command plugin
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            PLUGINS="$(oci instance-agent plugin list --compartment-id "$OCI_TENANCY_OCID" --instanceagent-id "$INSTANCE_ID" --all 2>/dev/null || true)"
            STATUS="$(jq -r '[.data[]? | select((.name|ascii_downcase|contains("run")) and (.name|ascii_downcase|contains("command")))][0].status // empty' <<<"$PLUGINS" 2>/dev/null || true)"
            if [ "$STATUS" = 'RUNNING' ]; then echo 'Run Command plugin is ready.'; exit 0; fi
            sleep 10
          done
          echo '::error::Run Command plugin did not become ready.'
          exit 1

      - name: Deploy Trọc AI privately over WireGuard
        shell: bash
        run: |
          set -euo pipefail
          KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          MODEL_B64="$(printf '%s' "$TROC_AI_MODEL" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          test -x /usr/bin/node || test -x /usr/local/bin/node || { echo 'Node is not installed yet'; exit 20; }
          systemctl is-active --quiet wg-quick@wg0 || { echo 'WireGuard wg0 is not active yet'; exit 21; }
          ip -4 addr show wg0 | grep -q '10\.77\.0\.1/24' || { echo 'WireGuard address 10.77.0.1/24 missing'; exit 22; }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 4 --retry-delay 2 https://github.com/nhatkhoa-jpg/TrocAutoStudio-Releases/archive/refs/heads/main.tar.gz | tar -xz -C "$tmp"
          src="$(find "$tmp" -mindepth 2 -maxdepth 2 -type d -name troc-ai | head -n1)"
          test -n "$src"

          rm -rf /opt/troc-ai.new
          cp -a "$src" /opt/troc-ai.new
          chown -R root:root /opt/troc-ai.new
          chmod -R go-w /opt/troc-ai.new

          install -d -m 700 /etc/troc-ai /var/lib/troc-ai /srv/troc-work/queue /srv/troc-work/running /srv/troc-work/done /srv/troc-work/failed
          printf '%s' '__KEY_B64__' | base64 -d > /etc/troc-ai/gemini.key
          chmod 600 /etc/troc-ai/gemini.key
          printf '%s' '__MODEL_B64__' | base64 -d > /etc/troc-ai/model
          chmod 600 /etc/troc-ai/model
          {
            printf 'GEMINI_API_KEY=%s\n' "$(cat /etc/troc-ai/gemini.key)"
            printf 'TROC_AI_MODEL=%s\n' "$(cat /etc/troc-ai/model)"
            printf 'TROC_AI_HOST=10.77.0.1\n'
            printf 'TROC_AI_PORT=8787\n'
            printf 'TROC_AI_STATE_DIR=/var/lib/troc-ai\n'
            printf 'TROC_AI_QUEUE_DIR=/srv/troc-work/queue\n'
          } > /etc/troc-ai/env
          chmod 600 /etc/troc-ai/env

          if [ -d /opt/troc-ai ]; then mv /opt/troc-ai /opt/troc-ai.prev; fi
          mv /opt/troc-ai.new /opt/troc-ai
          rm -rf /opt/troc-ai.prev

          cat >/etc/systemd/system/troc-ai.service <<'UNIT'
          [Unit]
          Description=Trọc AI private mobile gateway
          After=network-online.target wg-quick@wg0.service
          Wants=network-online.target wg-quick@wg0.service

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/troc-ai
          EnvironmentFile=/etc/troc-ai/env
          ExecStart=/usr/bin/node /opt/troc-ai/server.mjs
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/troc-ai /srv/troc-work
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now troc-ai.service
          systemctl restart troc-ai.service
          for i in $(seq 1 30); do
            if curl -fsS http://10.77.0.1:8787/api/health >/tmp/troc-ai-health.json; then break; fi
            sleep 2
          done
          cat /tmp/troc-ai-health.json
          node -e "const h=require('/tmp/troc-ai-health.json'); if(!h.ok||!h.gemini_ready) process.exit(1)"
          curl -fsS --max-time 90 -H 'content-type: application/json' -d '{"message":"Chỉ trả lời đúng một từ: OK","history":[],"mode":"chat"}' http://10.77.0.1:8787/api/chat >/tmp/troc-ai-chat.json
          node -e "const d=require('/tmp/troc-ai-chat.json'); if(!d.answer) process.exit(1); console.log('CHAT_SMOKE='+d.answer.slice(0,80).replace(/\\n/g,' '))"
          systemctl is-active troc-ai.service
          echo 'TROC_AI_DEPLOY_OK=1'
          REMOTE
          )"
          REMOTE_SCRIPT="${REMOTE_SCRIPT//__KEY_B64__/$KEY_B64}"
          REMOTE_SCRIPT="${REMOTE_SCRIPT//__MODEL_B64__/$MODEL_B64}"
          CONTENT="$(jq -cn --arg text "$REMOTE_SCRIPT" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD_ID="$(oci instance-agent command create --compartment-id "$OCI_TENANCY_OCID" --content "$CONTENT" --target "$TARGET" --timeout-in-seconds 1800 --display-name 'deploy-troc-ai' --query 'data.id' --raw-output)"
          EXEC=''
          FINAL=''
          for i in $(seq 1 180); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || true)"
            FINAL="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            case "$FINAL" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 10
          done
          OUTPUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          EXIT_CODE="$(jq -r '.data.content."exit-code" // 999' <<<"$EXEC" 2>/dev/null || echo 999)"
          printf '%s\n' "$OUTPUT"
          echo "Remote state=$FINAL exit=$EXIT_CODE"
          test "$FINAL" = 'SUCCEEDED'
          test "$EXIT_CODE" = '0'
          grep -q 'TROC_AI_DEPLOY_OK=1' <<<"$OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Trọc AI deployed'
            echo ''
            echo "- Oracle A1: \`$OCI_PUBLIC_IP\` in \`$OCI_REGION\`"
            echo '- Private UI: `http://10.77.0.1:8787` over WireGuard only'
            echo "- Gemini model: \`$TROC_AI_MODEL\`"
            echo '- Systemd: `troc-ai.service`, restart-always, 24/7'
            echo '- API key remains server-side in `/etc/troc-ai/env` mode 600'
            echo '- Chat smoke test passed before this job can succeed'
            echo '- No public web port was opened'
          } >> "$GITHUB_STEP_SUMMARY"

name: Oracle A1 Guest Inspect (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-a1-guest-inspect.yml'

permissions:
  contents: read

concurrency:
  group: oracle-a1-guest-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
      EXPECTED_SHAPE: VM.Standard.A1.Flex

    steps:
      - name: Configure OCI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY"
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"
          else
            printf 'key_file=%s\n' "$HOME/.oci/key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"
          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          CONFIG_REGION="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          test -n "$TENANCY_ID" && test "$CONFIG_REGION" = "$EXPECTED_REGION"
          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> "$GITHUB_ENV"
          echo "SUPPRESS_LABEL_WARNING=True" >> "$GITHUB_ENV"

      - name: Locate healthy bounded A1 and Run Command plugin
        shell: bash
        run: |
          set -euo pipefail
          J="$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" --region "$EXPECTED_REGION" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"
          SHAPE="$(jq -r '.shape' <<<"$J")"
          CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"
          RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"
          test "$SHAPE" = "$EXPECTED_SHAPE"
          awk -v v="$CPU" 'BEGIN{exit !(v<=2)}'
          awk -v v="$RAM" 'BEGIN{exit !(v<=12)}'
          echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"

          PLUGINS="$(oci instance-agent plugin list --compartment-id "$OCI_TENANCY_OCID" --instanceagent-id "$ID" --region "$EXPECTED_REGION" --all)"
          RC_STATUS="$(jq -r '[.data[]? | select((.name|ascii_downcase|contains("run")) and (.name|ascii_downcase|contains("command")))][0].status // empty' <<<"$PLUGINS")"
          echo "Run Command plugin: ${RC_STATUS:-missing}"
          test "$RC_STATUS" = RUNNING

      - name: Inspect guest without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' SCRIPT <<'EOS' || true
          set -euo pipefail
          echo '=== guest ==='
          uname -a
          echo '=== services ==='
          for u in wg-quick@wg0.service troc-ai.service; do
            printf '%s=' "$u"
            systemctl is-active "$u" 2>/dev/null || true
            printf '%s_enabled=' "$u"
            systemctl is-enabled "$u" 2>/dev/null || true
          done
          echo '=== wireguard ==='
          if command -v wg >/dev/null 2>&1; then
            wg show wg0 2>/dev/null | sed -E '/private key:/d' || true
            echo 'latest_handshakes:'
            wg show wg0 latest-handshakes 2>/dev/null || true
          fi
          echo '=== listeners ==='
          ss -lntup 2>/dev/null | grep -E '(:8787|:51820)' || true
          echo '=== health ==='
          curl -fsS --max-time 5 http://10.77.0.1:8787/api/health 2>/dev/null | jq '{ok,service,model,gemini_ready,active_requests,queued_requests}' || true
          echo '=== end ==='
          EOS

          CONTENT="$(jq -cn --arg text "$SCRIPT" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD_ID="$(oci instance-agent command create --compartment-id "$OCI_TENANCY_OCID" --region "$EXPECTED_REGION" --content "$CONTENT" --target "$TARGET" --timeout-in-seconds 300 --display-name 'troc-a1-readonly-guest-inspect' --query 'data.id' --raw-output)"
          test -n "$CMD_ID" && test "$CMD_ID" != null

          FINAL=''
          EXEC=''
          for _ in $(seq 1 60); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$EXPECTED_REGION" 2>/dev/null || true)"
            FINAL="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            case "$FINAL" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 5
          done
          OUTPUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUTPUT"
          test "$FINAL" = SUCCEEDED

      - name: Remove temporary OCI credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"

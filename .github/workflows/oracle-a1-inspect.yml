name: Oracle A1 Inspect (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-a1-inspect.yml'

permissions:
  contents: read

concurrency:
  group: oracle-a1-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      EXPECTED_REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
      EXPECTED_SHAPE: VM.Standard.A1.Flex

    steps:
      - name: Configure OCI CLI without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG"
          test -n "$OCI_PRIVATE_KEY"
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s#^key_file=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"
          else
            printf 'key_file=%s\n' "$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"
          fi
          chmod 600 "$HOME/.oci/config"
          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          CONFIG_REGION="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          test -n "$TENANCY_ID"
          test "$CONFIG_REGION" = "$EXPECTED_REGION"
          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> "$GITHUB_ENV"

      - name: Inspect exact A1 instance and boot volume
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" --region "$EXPECTED_REGION" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[] | select(."lifecycle-state" != "TERMINATED")] | sort_by(."time-created") | last')"
          test "$INSTANCE_JSON" != 'null'
          INSTANCE_ID="$(jq -r '.id' <<<"$INSTANCE_JSON")"
          STATE="$(jq -r '."lifecycle-state"' <<<"$INSTANCE_JSON")"
          SHAPE="$(jq -r '.shape' <<<"$INSTANCE_JSON")"
          CPU="$(jq -r '."shape-config".ocpus' <<<"$INSTANCE_JSON")"
          RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$INSTANCE_JSON")"
          AD="$(jq -r '."availability-domain"' <<<"$INSTANCE_JSON")"

          test "$SHAPE" = "$EXPECTED_SHAPE"
          awk -v v="$CPU" 'BEGIN {exit !(v<=2)}'
          awk -v v="$RAM" 'BEGIN {exit !(v<=12)}'

          BVA_JSON="$(oci compute boot-volume-attachment list --compartment-id "$OCI_TENANCY_OCID" --availability-domain "$AD" --instance-id "$INSTANCE_ID" --region "$EXPECTED_REGION" --all)"
          BOOT_ID="$(jq -r '[.data[] | select(."lifecycle-state" != "DETACHED")][0]."boot-volume-id" // empty' <<<"$BVA_JSON")"
          test -n "$BOOT_ID"
          BOOT_GB="$(oci bv boot-volume get --boot-volume-id "$BOOT_ID" --region "$EXPECTED_REGION" --query 'data."size-in-gbs"' --raw-output)"
          test "$BOOT_GB" = '50'

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "A1_STATE=$STATE" >> "$GITHUB_ENV"
          echo "A1_SHAPE=$SHAPE" >> "$GITHUB_ENV"
          echo "A1_CPU=$CPU" >> "$GITHUB_ENV"
          echo "A1_RAM=$RAM" >> "$GITHUB_ENV"
          echo "A1_BOOT_GB=$BOOT_GB" >> "$GITHUB_ENV"
          echo "A1_AD=$AD" >> "$GITHUB_ENV"

          printf 'A1: state=%s shape=%s cpu=%s ram_gb=%s boot_gb=%s region=%s\n' "$STATE" "$SHAPE" "$CPU" "$RAM" "$BOOT_GB" "$EXPECTED_REGION"

      - name: Inspect current VNIC, public IP and ingress rules
        shell: bash
        run: |
          set -euo pipefail
          VNIC_ID="$(oci compute vnic-attachment list --compartment-id "$OCI_TENANCY_OCID" --instance-id "$INSTANCE_ID" --region "$EXPECTED_REGION" --all | jq -r '[.data[] | select(."lifecycle-state"=="ATTACHED")][0]."vnic-id" // empty')"
          test -n "$VNIC_ID"
          VNIC_JSON="$(oci network vnic get --vnic-id "$VNIC_ID" --region "$EXPECTED_REGION")"
          PRIVATE_IP="$(jq -r '.data."private-ip" // empty' <<<"$VNIC_JSON")"
          PUBLIC_IP="$(jq -r '.data."public-ip" // empty' <<<"$VNIC_JSON")"
          SUBNET_ID="$(jq -r '.data."subnet-id" // empty' <<<"$VNIC_JSON")"
          NSG_IDS="$(jq -c '.data."nsg-ids" // []' <<<"$VNIC_JSON")"
          test -n "$SUBNET_ID"

          SUBNET_JSON="$(oci network subnet get --subnet-id "$SUBNET_ID" --region "$EXPECTED_REGION")"
          SEC_IDS="$(jq -r '.data."security-list-ids"[]?' <<<"$SUBNET_JSON")"

          RULES='[]'
          while IFS= read -r SID; do
            [ -n "$SID" ] || continue
            ONE="$(oci network security-list get --security-list-id "$SID" --region "$EXPECTED_REGION" | jq '.data."ingress-security-rules"')"
            RULES="$(jq -cn --argjson a "$RULES" --argjson b "$ONE" '$a+$b')"
          done <<< "$SEC_IDS"

          while IFS= read -r NID; do
            [ -n "$NID" ] || continue
            ONE="$(oci network nsg rules list --network-security-group-id "$NID" --direction INGRESS --region "$EXPECTED_REGION" --all | jq '.data.items // .data // []')"
            RULES="$(jq -cn --argjson a "$RULES" --argjson b "$ONE" '$a+$b')"
          done < <(jq -r '.[]' <<<"$NSG_IDS")

          echo "OCI_PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "OCI_PRIVATE_IP=$PRIVATE_IP" >> "$GITHUB_ENV"
          echo "Current public IPv4: ${PUBLIC_IP:-none}"
          echo 'Relevant ingress rules (sanitized):'
          jq -r '
            .[] |
            . as $r |
            ($r.protocol // "") as $p |
            ($r.source // $r."source-type" // "") as $src |
            ($r."tcp-options"."destination-port-range".min // $r."tcp-options"."destination-port-range".max // null) as $tcp |
            ($r."udp-options"."destination-port-range".min // $r."udp-options"."destination-port-range".max // null) as $udp |
            select(($tcp==22) or ($tcp==8787) or ($udp==51820)) |
            "protocol=\($p) source=\($src) tcp=\($tcp // "-") udp=\($udp // "-")"
          ' <<<"$RULES" || true

          HAS_PUBLIC_8787="$(jq '[.[] | select((."tcp-options"."destination-port-range".min // -1) <= 8787 and (."tcp-options"."destination-port-range".max // -1) >= 8787)] | length' <<<"$RULES")"
          HAS_PUBLIC_22="$(jq '[.[] | select((."tcp-options"."destination-port-range".min // -1) <= 22 and (."tcp-options"."destination-port-range".max // -1) >= 22)] | length' <<<"$RULES")"
          HAS_51820="$(jq '[.[] | select((."udp-options"."destination-port-range".min // -1) <= 51820 and (."udp-options"."destination-port-range".max // -1) >= 51820)] | length' <<<"$RULES")"
          echo "INGRESS_TCP_22_RULES=$HAS_PUBLIC_22" >> "$GITHUB_ENV"
          echo "INGRESS_TCP_8787_RULES=$HAS_PUBLIC_8787" >> "$GITHUB_ENV"
          echo "INGRESS_UDP_51820_RULES=$HAS_51820" >> "$GITHUB_ENV"

      - name: Read-only summary
        shell: bash
        run: |
          {
            echo '## Oracle A1 read-only inspection'
            echo ''
            echo "- Region: \`$EXPECTED_REGION\`"
            echo "- Instance: \`$INSTANCE_NAME\`"
            echo "- State: \`$A1_STATE\`"
            echo "- Shape: \`$A1_SHAPE\`"
            echo "- Resources: \`$A1_CPU OCPU / $A1_RAM GB RAM / $A1_BOOT_GB GB boot\`"
            echo "- Current public IPv4: \`${OCI_PUBLIC_IP:-none}\`"
            echo "- Private IPv4: \`${OCI_PRIVATE_IP:-none}\`"
            echo "- Matching TCP/22 ingress rules: \`$INGRESS_TCP_22_RULES\`"
            echo "- Matching TCP/8787 ingress rules: \`$INGRESS_TCP_8787_RULES\`"
            echo "- Matching UDP/51820 ingress rules: \`$INGRESS_UDP_51820_RULES\`"
            echo ''
            echo '> This workflow performs OCI read operations only and never creates, terminates, starts, stops, or modifies compute/network resources.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary OCI credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.oci/oci_api_key.pem" "$HOME/.oci/config"

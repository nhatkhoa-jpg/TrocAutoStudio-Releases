name: Oracle A1 Status Now

on:
  workflow_dispatch:
  push:
    branches: ['work/troc-ai-mobile-v1']
    paths:
      - '.github/workflows/oracle-a1-status-now.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Configure OCI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          TENANCY_ID="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$HOME/.oci/config")"
          echo "OCI_TENANCY_OCID=$TENANCY_ID" >> "$GITHUB_ENV"

      - name: Inspect A1 through Run Command
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="$(oci compute instance list --compartment-id "$OCI_TENANCY_OCID" --display-name "$INSTANCE_NAME" --all | jq -r '[.data[] | select(."lifecycle-state"=="RUNNING" and .shape=="VM.Standard.A1.Flex")] | sort_by(."time-created") | last | .id // empty')"
          test -n "$INSTANCE_ID"
          SCRIPT=$(cat <<'REMOTE'
          set +e
          echo '=== A1 STATUS ==='
          date -Is
          uname -a
          uptime
          echo '--- tools ---'
          command -v node && node --version
          command -v npm && npm --version
          command -v gemini && gemini --version
          command -v codex && codex --version
          command -v docker && docker --version
          echo '--- services ---'
          systemctl is-active docker 2>/dev/null || true
          systemctl is-active wg-quick@wg0 2>/dev/null || true
          systemctl is-active troc-ai 2>/dev/null || true
          echo '--- wireguard ---'
          ip -4 addr show wg0 2>/dev/null || true
          wg show 2>/dev/null || true
          echo '--- swap/memory/disk ---'
          free -h
          swapon --show
          df -h /
          echo '--- bootstrap marker ---'
          ls -l /usr/local/bin/troc-health 2>/dev/null || true
          echo '--- active installers ---'
          ps -eo pid,etimes,cmd | grep -E 'apt|dpkg|npm|gemini|codex|oracle|troc' | grep -v grep | head -n 40 || true
          echo '=== END A1 STATUS ==='
          REMOTE
          )
          CONTENT="$(jq -cn --arg text "$SCRIPT" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"},commandString:"/bin/bash"}')"
          TARGET="$(jq -cn --arg id "$INSTANCE_ID" '{instanceId:$id}')"
          CMD_ID="$(oci instance-agent command create --compartment-id "$OCI_TENANCY_OCID" --content "$CONTENT" --target "$TARGET" --timeout-in-seconds 300 --display-name 'a1-status-now' --query 'data.id' --raw-output)"
          EXEC=''; FINAL=''
          for i in $(seq 1 40); do
            EXEC="$(oci instance-agent command-execution get --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || true)"
            FINAL="$(jq -r '.data."lifecycle-state" // empty' <<<"$EXEC" 2>/dev/null || true)"
            case "$FINAL" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 5
          done
          OUTPUT="$(jq -r '.data.content.text // .data.content.message // empty' <<<"$EXEC" 2>/dev/null || true)"
          printf '%s\n' "$OUTPUT"
          echo "state=$FINAL"
          test "$FINAL" = SUCCEEDED

name: Oracle A1 Troc AI Minimal

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-troc-ai-minimal.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-troc-ai-minimal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Validate exact healthy A1
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY" && test -n "$GEMINI_API_KEY"
          python -m pip install --disable-pip-version-check --quiet --prefer-binary oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"; SH="$(jq -r '.shape' <<<"$J")"; CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"; RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"; AD="$(jq -r '."availability-domain"' <<<"$J")"
          test "$SH" = 'VM.Standard.A1.Flex'; awk -v v="$CPU" 'BEGIN{exit !(v==2)}'; awk -v v="$RAM" 'BEGIN{exit !(v==12)}'
          BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '[.data[]|select(."lifecycle-state"!="DETACHED")][0]."boot-volume-id" // empty')"
          SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)"; awk -v v="$SIZE" 'BEGIN{exit !(v==50)}'
          PUB="$(oci compute instance list-vnics --instance-id "$ID" --region "$R" | jq -r '.data[]|select(."is-primary"==true)|."public-ip"' | head -1)"
          echo "TENANCY=$T" >> "$GITHUB_ENV"; echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"; echo "PUBLIC_IP=$PUB" >> "$GITHUB_ENV"
          echo "SAFE_A1_OK shape=$SH cpu=$CPU ram=$RAM boot=$SIZE ip=$PUB"

      - name: Install and verify Trọc AI only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w0)"
          python3 - <<'PY'
          import json, os
          keyb64=os.environ['KEY_B64']
          script=r'''set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v curl >/dev/null 2>&1; then apt-get update -y && apt-get install -y --no-install-recommends curl ca-certificates; fi
          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'Number(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -lt 20 ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          install -d -m 700 /etc/troc-ai /var/lib/troc-ai /srv/troc-work/queue /srv/troc-work/running /srv/troc-work/done /srv/troc-work/failed
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 5 --retry-delay 2 https://github.com/nhatkhoa-jpg/TrocAutoStudio-Releases/archive/refs/heads/work/troc-ai-mobile-v1.tar.gz | tar -xz -C "$tmp"
          src="$(find "$tmp" -type d -name troc-ai | head -1)"; test -n "$src"
          node --check "$src/server.mjs"
          rm -rf /opt/troc-ai.new; cp -a "$src" /opt/troc-ai.new; chown -R root:root /opt/troc-ai.new; chmod -R go-w /opt/troc-ai.new
          printf '%s' '__KEY_B64__' | base64 -d > /etc/troc-ai/gemini.key; chmod 600 /etc/troc-ai/gemini.key
          {
            printf 'GEMINI_API_KEY=%s\n' "$(cat /etc/troc-ai/gemini.key)"
            printf 'TROC_AI_MODEL=gemini-3.8-flash\n'
            printf 'TROC_AI_HOST=127.0.0.1\nTROC_AI_PORT=8787\nTROC_AI_STATE_DIR=/var/lib/troc-ai\nTROC_AI_QUEUE_DIR=/srv/troc-work/queue\n'
          } > /etc/troc-ai/env
          chmod 600 /etc/troc-ai/env
          rm -rf /opt/troc-ai.prev; [ ! -d /opt/troc-ai ] || mv /opt/troc-ai /opt/troc-ai.prev; mv /opt/troc-ai.new /opt/troc-ai; rm -rf /opt/troc-ai.prev
          cat >/etc/systemd/system/troc-ai.service <<'UNIT'
          [Unit]
          Description=Trọc AI local gateway
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/troc-ai
          EnvironmentFile=/etc/troc-ai/env
          ExecStart=/usr/bin/node /opt/troc-ai/server.mjs
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/troc-ai /srv/troc-work
          ProtectHome=true
          MemoryMax=3G
          CPUQuota=120%
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable troc-ai.service
          systemctl restart troc-ai.service
          for i in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8787/api/health >/tmp/h.json && break || sleep 2; done
          python3 - <<'PY2'
          import json
          d=json.load(open('/tmp/h.json'))
          assert d.get('ok') is True
          assert d.get('gemini_ready') is True
          print('TROC_AI_HEALTH_OK=1')
          PY2
          curl -fsS --max-time 120 -H 'content-type: application/json' -d '{"message":"Reply exactly: TROC_AI_OK","history":[],"mode":"chat"}' http://127.0.0.1:8787/api/chat >/tmp/c.json
          python3 - <<'PY3'
          import json
          d=json.load(open('/tmp/c.json'))
          ans=str(d.get('answer','')).strip()
          print('TROC_AI_REPLY='+ans)
          assert 'TROC_AI_OK' in ans
          print('TROC_AI_CHAT_OK=1')
          PY3
          systemctl is-active troc-ai.service | grep -q active
          ss -ltnp | grep -q '127.0.0.1:8787'
          echo TROC_AI_SERVICE_OK=1
          '''.replace('__KEY_B64__', keyb64)
          with open('/tmp/troc-ai-command.json','w') as f:
              json.dump({"source":{"sourceType":"TEXT","text":script},"output":{"outputType":"TEXT"}},f)
          PY
          C="$(oci instance-agent command create --region "$REGION" --compartment-id "$TENANCY" --target '{"instanceId":"'"$INSTANCE_ID"'"}' --content file:///tmp/troc-ai-command.json --timeout-in-seconds 900 --display-name troc-ai-minimal-deploy --query 'data.id' --raw-output)"
          E=''; S=''
          for i in $(seq 1 140); do
            E="$(oci instance-agent command-execution get --command-id "$C" --instance-id "$INSTANCE_ID" --region "$REGION" 2>/dev/null || true)"
            S="$(jq -r '.data."lifecycle-state" // empty' <<<"$E" 2>/dev/null || true)"
            echo "troc_ai_check=$i state=${S:-unknown}"
            case "$S" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 5
          done
          O="$(jq -r '.data.content.output // empty' <<<"$E" 2>/dev/null | base64 -d 2>/dev/null || true)"
          [ -n "$O" ] || O="$(jq -r '.data.content.text // empty' <<<"$E" 2>/dev/null || true)"
          printf '%s\n' "$O" | sed -E 's/((token|secret|private.?key|gemini_api_key)[=:])[[:graph:]]+/\1[REDACTED]/Ig'
          test "$S" = SUCCEEDED
          grep -q 'TROC_AI_HEALTH_OK=1' <<<"$O"
          grep -q 'TROC_AI_CHAT_OK=1' <<<"$O"
          grep -q 'TROC_AI_SERVICE_OK=1' <<<"$O"
        env:
          KEY_B64: ${{ env.KEY_B64 }}

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config" /tmp/troc-ai-command.json

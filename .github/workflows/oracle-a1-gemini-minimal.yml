name: Oracle A1 Gemini Minimal

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-a1-gemini-minimal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REGION: ap-singapore-2
      INSTANCE_NAME: troc-cloud-codex
    steps:
      - name: Validate exact existing A1
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OCI_CONFIG" && test -n "$OCI_PRIVATE_KEY" && test -n "$GEMINI_API_KEY"
          python -m pip install --disable-pip-version-check --quiet --prefer-binary oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"; chmod 600 "$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          if grep -q '^key_file=' "$HOME/.oci/config"; then sed -i "s#^key_file=.*#key_file=$HOME/.oci/key.pem#" "$HOME/.oci/config"; else echo "key_file=$HOME/.oci/key.pem" >> "$HOME/.oci/config"; fi
          chmod 600 "$HOME/.oci/config"
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          T="$(awk -F= '/^tenancy=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          R="$(awk -F= '/^region=/{gsub(/[[:space:]]/,"",$2);print $2;exit}' "$HOME/.oci/config")"
          test -n "$T" && test "$R" = "$REGION"
          J="$(oci compute instance list --compartment-id "$T" --region "$R" --display-name "$INSTANCE_NAME" --all | jq -c '[.data[]|select(."lifecycle-state"=="RUNNING")]|sort_by(."time-created")|last')"
          test "$J" != null
          ID="$(jq -r '.id' <<<"$J")"; SH="$(jq -r '.shape' <<<"$J")"; CPU="$(jq -r '."shape-config".ocpus' <<<"$J")"; RAM="$(jq -r '."shape-config"."memory-in-gbs"' <<<"$J")"; AD="$(jq -r '."availability-domain"' <<<"$J")"
          test "$SH" = 'VM.Standard.A1.Flex'; awk -v v="$CPU" 'BEGIN{exit !(v==2)}'; awk -v v="$RAM" 'BEGIN{exit !(v==12)}'
          BV="$(oci compute boot-volume-attachment list --availability-domain "$AD" --compartment-id "$T" --instance-id "$ID" --region "$R" --all | jq -r '[.data[]|select(."lifecycle-state"!="DETACHED")][0]."boot-volume-id" // empty')"
          SIZE="$(oci bv boot-volume get --boot-volume-id "$BV" --region "$R" --query 'data."size-in-gbs"' --raw-output)"; awk -v v="$SIZE" 'BEGIN{exit !(v==50)}'
          PUB="$(oci compute instance list-vnics --instance-id "$ID" --region "$R" | jq -r '.data[]|select(."is-primary"==true)|."public-ip"' | head -1)"
          echo "TENANCY=$T" >> "$GITHUB_ENV"; echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"; echo "PUBLIC_IP=$PUB" >> "$GITHUB_ENV"
          echo "SAFE_A1_OK shape=$SH cpu=$CPU ram=$RAM boot=$SIZE ip=$PUB"

      - name: Run minimal Gemini smoke test on A1
        shell: bash
        run: |
          set -Eeuo pipefail
          export SUPPRESS_LABEL_WARNING=True OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          python3 - <<'PY'
          import json, os
          key=os.environ['GEMINI_API_KEY']
          script=r'''set -eu
          python3 - <<'PY2'
          import json, time, urllib.error, urllib.request
          KEY = __KEY__
          base = "https://generativelanguage.googleapis.com/v1beta"
          transient = {429, 500, 502, 503, 504}

          def get_json(req_or_url, timeout=30):
              with urllib.request.urlopen(req_or_url, timeout=timeout) as r:
                  return json.load(r)

          models = get_json(base + "/models?key=" + KEY).get("models", [])
          usable=[]
          for m in models:
              methods=m.get("supportedGenerationMethods", [])
              name=m.get("name", "")
              if "generateContent" in methods and name.startswith("models/"):
                  usable.append(name.split("/",1)[1])
          preferred=["gemini-3.8-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-2.5-flash-lite"]
          candidates=[]
          for x in preferred + [x for x in usable if "flash" in x.lower()] + usable:
              if x in usable and x not in candidates:
                  candidates.append(x)
          if not candidates:
              raise SystemExit("NO_GENERATECONTENT_MODEL_AVAILABLE")

          payload = json.dumps({"contents":[{"parts":[{"text":"Reply exactly: GEMINI_OK"}]}]}).encode()
          last_error = None
          for model in candidates[:8]:
              print("GEMINI_TRY_MODEL=" + model)
              url = base + "/models/" + model + ":generateContent?key=" + KEY
              req = urllib.request.Request(url, data=payload, headers={"Content-Type":"application/json"})
              for attempt in range(1, 4):
                  try:
                      data = get_json(req)
                      text=data["candidates"][0]["content"]["parts"][0]["text"].strip()
                      print("GEMINI_REPLY=" + text)
                      if "GEMINI_OK" not in text:
                          raise RuntimeError("UNEXPECTED_GEMINI_REPLY")
                      print("GEMINI_MODEL=" + model)
                      print("GEMINI_A1_OK=1")
                      raise SystemExit(0)
                  except urllib.error.HTTPError as e:
                      last_error = f"HTTP_{e.code}"
                      print(f"GEMINI_HTTP model={model} attempt={attempt} code={e.code}")
                      if e.code in transient and attempt < 3:
                          time.sleep(3 * attempt)
                          continue
                      break
                  except (urllib.error.URLError, TimeoutError) as e:
                      last_error = type(e).__name__
                      print(f"GEMINI_NET model={model} attempt={attempt} error={type(e).__name__}")
                      if attempt < 3:
                          time.sleep(3 * attempt)
                          continue
                      break
                  except Exception as e:
                      last_error = type(e).__name__
                      print(f"GEMINI_PARSE model={model} error={type(e).__name__}")
                      break
          raise SystemExit("GEMINI_ALL_MODELS_FAILED:" + str(last_error))
          PY2
          '''.replace('__KEY__', repr(key))
          content={"source":{"sourceType":"TEXT","text":script},"output":{"outputType":"TEXT"}}
          with open('/tmp/gemini-command.json','w') as f: json.dump(content,f)
          PY
          C="$(oci instance-agent command create --region "$REGION" --compartment-id "$TENANCY" --target '{"instanceId":"'"$INSTANCE_ID"'"}' --content file:///tmp/gemini-command.json --timeout-in-seconds 300 --display-name gemini-minimal-smoke --query 'data.id' --raw-output)"
          E=''; S=''
          for i in $(seq 1 100); do
            E="$(oci instance-agent command-execution get --command-id "$C" --instance-id "$INSTANCE_ID" --region "$REGION" 2>/dev/null || true)"
            S="$(jq -r '.data."lifecycle-state" // empty' <<<"$E" 2>/dev/null || true)"
            echo "gemini_check=$i state=${S:-unknown}"
            case "$S" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break;; esac
            sleep 5
          done
          O="$(jq -r '.data.content.output // empty' <<<"$E" 2>/dev/null | base64 -d 2>/dev/null || true)"
          [ -n "$O" ] || O="$(jq -r '.data.content.text // empty' <<<"$E" 2>/dev/null || true)"
          printf '%s\n' "$O" | sed -E 's/(key=)[^&[:space:]]+/\1[REDACTED]/g'
          test "$S" = SUCCEEDED
          grep -q 'GEMINI_A1_OK=1' <<<"$O"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config" /tmp/gemini-command.json
